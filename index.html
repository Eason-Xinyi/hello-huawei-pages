<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>华为工龄计算器 · 你在华为工作的天数</title>
<style>
  :root {
    --red: #cf0a2c;
    --red-deep: #a30621;
    --ink: #1d1d1f;
    --ink-2: #56565c;
    --ink-3: #8c8c94;
    --line: #ece7e7;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 520px at 12% -12%, #ffe3e6 0%, transparent 62%),
      radial-gradient(900px 480px at 96% 104%, #ffe9dd 0%, transparent 60%),
      #faf8f7;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px 32px 24px;
    box-shadow: 0 24px 60px -28px rgba(120, 20, 35, .28), 0 2px 8px rgba(0, 0, 0, .03);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 46px; height: 46px; flex: none;
    border-radius: 14px;
    background: linear-gradient(145deg, #e5193b, var(--red-deep));
    color: #fff;
    font: 700 22px/46px "Segoe UI", sans-serif;
    text-align: center;
    box-shadow: 0 8px 18px -8px rgba(207, 10, 44, .8);
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
  .sub { margin: 4px 0 0; font-size: 13px; color: var(--ink-3); }

  .field { margin-top: 28px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 10px; }
  .row { display: flex; gap: 10px; }
  input[type="date"] {
    flex: 1; min-width: 0;
    height: 50px;
    padding: 0 14px;
    font: 500 16px/1 inherit;
    color: var(--ink);
    background: #fbfafa;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  input[type="date"]:focus {
    background: #fff;
    border-color: var(--red);
    box-shadow: 0 0 0 4px rgba(207, 10, 44, .1);
  }
  button {
    flex: none;
    height: 50px;
    padding: 0 26px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(145deg, #e5193b, var(--red-deep));
    color: #fff;
    font: 600 16px/1 inherit;
    cursor: pointer;
    box-shadow: 0 10px 20px -12px rgba(207, 10, 44, .9);
    transition: transform .12s, filter .18s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px) scale(.99); }
  .hint { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-3); min-height: 17px; }
  .hint.error { color: var(--red); }

  .result {
    margin-top: 26px;
    padding: 26px 24px 20px;
    border-radius: 20px;
    background:
      radial-gradient(520px 220px at 100% 0%, #fff1f2 0%, transparent 70%),
      #fdfaf9;
    border: 1px solid #f6e4e5;
  }
  .caption { margin: 0; font-size: 13.5px; color: var(--ink-2); }
  .number {
    display: flex; align-items: baseline; gap: 8px;
    margin: 6px 0 18px;
  }
  #days {
    font: 700 clamp(52px, 14vw, 76px)/1 "Segoe UI", "PingFang SC", sans-serif;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(120deg, #e5193b, #9c0018);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .unit { font-size: 19px; font-weight: 600; color: var(--red); }
  .stats { display: grid; gap: 1px; background: #f1e6e7; border-radius: 12px; overflow: hidden; }
  .stat { display: flex; justify-content: space-between; gap: 16px; padding: 11px 14px; background: #fff; font-size: 13.5px; }
  .stat .k { color: var(--ink-3); flex: none; }
  .stat .v { color: var(--ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .foot { margin: 18px 0 0; font-size: 12px; color: var(--ink-3); text-align: center; }
  .shake { animation: shake .34s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  @media (max-width: 440px) {
    .card { padding: 24px 20px 20px; border-radius: 20px; }
    .row { flex-direction: column; }
    button { width: 100%; }
    .stat { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="card">
  <header class="brand">
    <div class="mark" aria-hidden="true">H</div>
    <div>
      <h1>华为工龄计算器</h1>
      <p class="sub">输入加入华为的日期，算出你在这里走过多少天</p>
    </div>
  </header>

  <form class="field" id="form" novalidate>
    <label for="join">加入华为的日期</label>
    <div class="row">
      <input type="date" id="join" name="join" required aria-describedby="hint" />
      <button type="submit">计算天数</button>
    </div>
    <p class="hint" id="hint">例如 2018-07-02</p>
  </form>

  <section class="result" id="result" hidden aria-live="polite">
    <p class="caption">截至 <span id="todayText"></span>，你已在华为工作</p>
    <div class="number"><span id="days">0</span><span class="unit">天</span></div>
    <div class="stats">
      <div class="stat"><span class="k">折合</span><span class="v" id="ymd">—</span></div>
      <div class="stat"><span class="k">其中工作日（周一至周五）</span><span class="v" id="workdays">—</span></div>
      <div class="stat"><span class="k">起止</span><span class="v" id="range">—</span></div>
    </div>
  </section>

  <p class="foot">按自然日计算，含入职当天与今天。</p>
</main>

<script>
(function () {
  var form = document.getElementById('form');
  var input = document.getElementById('join');
  var hint = document.getElementById('hint');
  var result = document.getElementById('result');
  var daysEl = document.getElementById('days');
  var ymdEl = document.getElementById('ymd');
  var workdaysEl = document.getElementById('workdays');
  var rangeEl = document.getElementById('range');
  var todayTextEl = document.getElementById('todayText');
  var STORAGE_KEY = 'huawei-join-date';
  var rafId = 0;

  function startOfToday() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function parseDate(value) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var date = new Date(y, mo - 1, d);
    if (date.getFullYear() !== y || date.getMonth() !== mo - 1 || date.getDate() !== d) return null;
    return date;
  }

  function dayDiff(a, b) {
    return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
      Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  }

  function breakdown(start, end) {
    var y = end.getFullYear() - start.getFullYear();
    var m = end.getMonth() - start.getMonth();
    var d = end.getDate() - start.getDate();
    if (d < 0) {
      m -= 1;
      d += new Date(end.getFullYear(), end.getMonth(), 0).getDate();
    }
    if (m < 0) { y -= 1; m += 12; }
    return { y: y, m: m, d: d };
  }

  function countWorkdays(start, end) {
    var total = 0;
    var cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    while (cur <= end) {
      var w = cur.getDay();
      if (w !== 0 && w !== 6) total += 1;
      cur.setDate(cur.getDate() + 1);
    }
    return total;
  }

  function fmt(date) {
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return date.getFullYear() + '-' + p(date.getMonth() + 1) + '-' + p(date.getDate());
  }

  function fmtCN(date) {
    return date.getFullYear() + ' 年 ' + (date.getMonth() + 1) + ' 月 ' + date.getDate() + ' 日';
  }

  function setHint(text, isError) {
    hint.textContent = text;
    hint.classList.toggle('error', !!isError);
  }

  function animateNumber(target) {
    cancelAnimationFrame(rafId);
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { daysEl.textContent = target.toLocaleString('zh-CN'); return; }
    var duration = 750;
    var from = 0;
    var t0 = performance.now();
    function frame(now) {
      var p = Math.min(1, (now - t0) / duration);
      var eased = 1 - Math.pow(1 - p, 3);
      daysEl.textContent = Math.round(from + (target - from) * eased).toLocaleString('zh-CN');
      if (p < 1) rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
  }

  function calculate() {
    var start = parseDate(input.value);
    var today = startOfToday();

    if (!start) {
      setHint('请先选择加入华为的日期', true);
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
      result.hidden = true;
      return;
    }
    if (start > today) {
      setHint('入职日期不能晚于今天', true);
      result.hidden = true;
      return;
    }

    var days = dayDiff(start, today) + 1;
    var parts = breakdown(start, today);
    var workdays = countWorkdays(start, today);

    todayTextEl.textContent = fmtCN(today);
    ymdEl.textContent = parts.y + ' 年 ' + parts.m + ' 个月 ' + parts.d + ' 天';
    workdaysEl.textContent = workdays.toLocaleString('zh-CN') + ' 天';
    rangeEl.textContent = fmt(start) + ' → ' + fmt(today);
    result.hidden = false;
    animateNumber(days);

    setHint('共 ' + days.toLocaleString('zh-CN') + ' 个自然日（含入职当天与今天）');
    try { localStorage.setItem(STORAGE_KEY, input.value); } catch (e) {}
  }

  input.max = fmt(startOfToday());
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { input.value = saved; calculate(); }
  } catch (e) {}

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    calculate();
  });
  input.addEventListener('change', function () {
    if (input.value) calculate();
    else { result.hidden = true; setHint('例如 2018-07-02'); }
  });
})();
</script>
</body>
</html>
